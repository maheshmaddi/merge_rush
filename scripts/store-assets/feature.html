<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- 1024x500 Play Store feature graphic. -->
    <style>
      html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; }
      body {
        position: relative;
        font-family: 'Segoe UI Variable Display', 'Segoe UI', system-ui, sans-serif;
        color: #f2f3ff;
        background:
          radial-gradient(520px 380px at 12% 10%, rgba(124, 58, 237, 0.75), transparent 70%),
          radial-gradient(520px 420px at 92% 100%, rgba(6, 182, 212, 0.55), transparent 70%),
          radial-gradient(360px 300px at 62% 30%, rgba(236, 72, 153, 0.35), transparent 70%),
          #070a1f;
      }
      .grid {
        position: absolute; left: -20%; right: -20%; bottom: -12%; height: 46%;
        background-image: linear-gradient(rgba(139, 92, 246, 0.28) 1px, transparent 1px),
          linear-gradient(90deg, rgba(139, 92, 246, 0.28) 1px, transparent 1px);
        background-size: 48px 48px;
        transform: perspective(500px) rotateX(62deg); transform-origin: bottom;
        -webkit-mask-image: linear-gradient(to top, rgba(0, 0, 0, 0.8), transparent 85%);
      }
      .copy { position: absolute; left: 70px; top: 110px; width: 470px; }
      h1 {
        margin: 0; font-size: 92px; font-weight: 900; font-style: italic; line-height: 1;
        background: linear-gradient(100deg, #c4b5fd 0%, #ffffff 35%, #67e8f9 65%, #ff9ecf 100%);
        -webkit-background-clip: text; background-clip: text; color: transparent;
        filter: drop-shadow(0 4px 22px rgba(139, 92, 246, 0.7));
        padding-right: 12px;
      }
      p { margin: 18px 0 0; font-size: 30px; font-weight: 800; letter-spacing: 0.06em; color: #e6e8ff; }
      p span { color: #ffc53d; }
      .tiles { position: absolute; right: 70px; top: 70px; width: 380px; height: 360px; }
      .t {
        position: absolute; width: 150px; height: 150px; border-radius: 30px;
        display: grid; place-items: center; font-weight: 900; font-size: 54px;
        box-shadow: inset 0 -10px 0 rgba(0,0,0,.18), inset 0 2px 0 rgba(255,255,255,.45);
      }
      .t::before {
        content: ''; position: absolute; inset: 0; border-radius: inherit;
        background: linear-gradient(180deg, rgba(255,255,255,.34), rgba(255,255,255,.06) 42%, transparent 52%);
      }
      .t1 { left: 0; top: 40px; transform: rotate(-10deg); color: #fff;
        background: linear-gradient(145deg, #ff5c9d, #d6246a); box-shadow: 0 16px 40px rgba(255,92,157,.55), inset 0 -10px 0 rgba(0,0,0,.18); }
      .t2 { left: 190px; top: 0; transform: rotate(8deg); color: #032836;
        background: linear-gradient(145deg, #55eaff, #0aa5d6); box-shadow: 0 16px 40px rgba(56,225,255,.55), inset 0 -10px 0 rgba(0,0,0,.18); }
      .t3 { left: 95px; top: 180px; width: 190px; height: 190px; border-radius: 38px; font-size: 64px; transform: rotate(-3deg); color: #3a1d00;
        background: linear-gradient(135deg, #fff3b0, #ffc53d 45%, #ff7a3d); box-shadow: 0 20px 60px rgba(255,170,40,.75), 0 0 60px rgba(255,122,61,.55), inset 0 -10px 0 rgba(0,0,0,.18); }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="copy">
      <h1>Merge Rush</h1>
      <p>MERGE · CHAIN · <span>RUSH</span></p>
    </div>
    <div class="tiles">
      <div class="t t1">128</div>
      <div class="t t2">512</div>
      <div class="t t3">2048</div>
    </div>
  </body>
</html>
